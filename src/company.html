<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Workshop | Company</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./css/style.css" />
</head>
<body>
  <div class="page">
    <header class="header">
      <a href="https://aiworkshop.su/" aria-label="AI Workshop">
        <img src="./image/logo.png" alt="AI Workshop" class="brand" />
      </a>

      <nav class="nav" aria-label="Основная навигация">
        <a href="https://aiworkshop.su/">Главная</a>
        <a href="https://aiworkshop.su/feed">Лента</a>
        <a href="https://t.me/AI_officina" target="_blank" rel="noopener noreferrer">ТГ-канал</a>
        <a href="./index.html" id="header-breadcrumb">ИИ модели</a>
      </nav>

      <div class="toolbar">
        <button class="search-btn" aria-label="Поиск">
          <img src="./image/search.png" alt="" aria-hidden="true" />
        </button>
        <button class="btn btn-login">Войти</button>
      </div>
    </header>

    <main class="content company-content">
      <section class="company-hero" aria-label="Описание компании">
        <img id="company-logo" src="" alt="" class="company-hero-logo" />
        <div class="company-hero-text">
          <h2 id="company-name"></h2>
          <p id="company-praise" class="company-praise"></p>
          <p id="company-description" class="company-description"></p>
        </div>
      </section>

      <section id="products-root" class="products-grid" aria-label="Продукты компании"></section>
    </main>

    <footer class="footer">
      <img src="./image/logo.png" alt="AI Workshop" />
      <span class="year">2026</span>
    </footer>
  </div>

  <script src="./js/catalog-data.js"></script>
  <script src="./js/company.js"></script>
</body>
</html>
